[project]
name = "depscan"
version = "0.1.0"
description = "Find a repo's dependencies, match them to known CVEs, locate their usage, and ask a local LLM whether each CVE affects the repo."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "GitPython>=3.1",
    "packaging>=24.0",
    "cvss>=3.2",
    "httpx>=0.27",
    "openai>=1.40",
    "streamlit>=1.40",
    "altair>=5.0",
    "rich>=13.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "libcst>=1.9.0",
    "playwright==1.62.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "screenshots"]
addopts = "-m fast --cov=depscan --cov-report=term"
markers = [
    "fast: offline, no LLM, < 1 s each (the default; unmarked tests get it automatically)",
    "slow: offline but slower (Streamlit AppTest, big inputs, performance); pytest -m slow",
    "network: needs the internet (PyPI, OSV, GitHub); pytest -m network",
    "llm: needs a running model (local Ollama or a cloud profile); pytest -m llm",
    "gui: real browser runs with Playwright against a running app; pytest -m gui tests/gui",
    "security: depscan's own safety against malicious repos and packages (also fast unless marked slow)",
    "metamorphic: meaning-preserving / meaning-changing code transformations (also fast unless marked slow)",
    "realworld: real public projects, scanned and checked; pytest -m realworld",
]
